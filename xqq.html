<style>

2px 0 #7a5f44;cursor:pointer;border:1px solid #e8d5b0;letter-spacing:0.5px;min-width:40px}.btn:active{transform:translateY(2px);box-shadow:0 0 0 #7a5f44}.btn:disabled{opacity:.4;transform:translateY(1px);box-shadow:0 1px 0 #7a5f44;cursor:not-allowed}.btn.secondary{background:#5d7a6a;color:#f0e2c5;box-shadow:0 2px 0 #2f4a3a;border-color:#7fa38b}.btn.danger{background:#a55a4a;color:#fff0e0;box-shadow:0 2px 0 #6a3528;border-color:#c97a6a}.btn.primary{background:#4a8c6a;color:#fff;box-shadow:0 2px 0 #2a5a3a;border-color:#6aaa7a}.log-area{margin-top:3px;background:#0f221b;border-radius:8px;padding:2px 6px;flex:1;overflow-y:auto;color:#b9d0c0;font-size:10px;border:1px solid #4a6a5a;min-height:50px;max-height:200px}.log-area div{padding:1px 0;border-bottom:1px solid #2a4a3a}.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#00000066;z-index:999;justify-content:center;align-items:center}.modal-overlay.show{display:flex}.modal{background:#2d4a3a;padding:16px 20px;border-radius:24px;border:2px solid #b89b7b;max-width:360px;width:90%;text-align:center;color:#f0e2c5}.modal h2{font-size:20px;margin:0 0 6px;color:#f5d742}.modal p{font-size:14px;margin:4px 0 12px;white-space:pre-wrap;word-break:break-all;text-align:left;padding:0 8px}.modal .btn{font-size:14px;padding:8px 20px;margin:4px}.modal .btn-group{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}:root{--play-w:clamp(26px,6vw,34px);--play-font:clamp(11px,2.2vw,13px);--hand-w:clamp(34px,9vw,46px);--hand-font:clamp(11px,2.2vw,13px);--win-font:clamp(11px,2.2vw,13px);--win-ratio:54/72}.reveal-card{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;background:#fcf3e0;padding:30px 40px;border-radius:20px;border:6px solid #b89b7b;box-shadow:0 0 60px #000000cc;z-index:1000;display:none;align-items:center;justify-content:center;font-weight:bold;color:#1a1a1a;min-width:120px;min-height:160px}.reveal-card.show{display:flex}.reveal-card.red{color:#b22222}.reveal-card.black{color:#1a1a1a}.reveal-card.joker{font-size:120px}
@media(max-width:500px){
    .play-card{--play-w:clamp(20px,5vw,28px);--play-font:clamp(10px,2vw,12px)}

}

<body>
<div id="app">
<div class="status">
 <div class="turn" id="turnIndicator">🔴 等待开始</div>
 <div><span>🧑 <span id="score0">0</span>摞</span><span> 🤖 <span id="score1">0</span>摞</span><span> 🤖 <span id="score2">0</span>摞</span></div>
 <div><span>💰 <span id="chips0">10</span></span><span> 💰 <span id="chips1">10</span></span><span> 💰 <span id="chips2">10</span></span></div>

<div class="ai-area"><div class="ai-player"><div class="label">🤖 左AI</div><div class="cards-back" id="a1"></div><div class="hand-count" id="c1">0张</div><div class="pile-info">📦 <span id="p1">0</span>摞</div></div><div class="ai-player"><div class="label">🤖 右AI</div><div class="cards-back" id="a2"></div><div class="hand-count" id="c2">0张</div><div class="pile-info">📦 <span id="p2">0</span>摞</div></div></div>

<div class="table-area">
 <div class="table-top">
  <div class="table-left" id="winLeft"><div class="win-label">左AI赢牌</div><div class="win-pile-h" id="winPileLeft"></div></div>
  <div class="table-center">
   <div id="roundInfo" class="round-info"></div>
   <div class="center-content">
    <div id="padStack" class="pad-stack"></div>
    <div id="roundPlayRow" class="round-play-row"></div>
    <div class="table-owner" id="tableOwner">等待出牌...</div>
   </div>
   <div class="bottom-area">
    <div class="win-label" style="color:#f0e2c5;font-size:8px;margin-top:4px;">🧑 你的赢牌</div>

   </div>
  </div>
  <div class="table-right" id="winRight"><div class="win-label">右AI赢牌</div><div class="win-pile-h" id="winPileRight"></div></div>
 </div>

<div class="player-area">
 <div class="label">
  <span>🧑 你的手牌</span>

 </div>

<script>
// ==================== 工具函数 ====================
function getDisplay(c){
 if(!c)return'';
 if(c.type==='炮') return '🃏';
 if(c.type==='兵') return '♥'+(c.num||2);
 if(c.type==='卒') return '♠'+(c.num||2);
 const s=c.suit||(c.color==='red'?'♥':'♠');
 const m={'仕':'A','士':'A','象':'K','相':'K','马':'Q','车':'J'};
 return s+(m[c.type]||c.type);
}
function getShortDisplay(c){
 if(!c)return'';
 if(c.type==='炮') return '🃏';
 const s=c.suit||(c.color==='red'?'♥':'♠');
 if(c.type==='兵') return s+(c.num||2);
 if(c.type==='卒') return s+(c.num||2);
 const m={'仕':'A','士':'A','象':'K','相':'K','马':'Q','车':'J'};
 return s+(m[c.type]||c.type);
}
function deck(){
 let d=[];
 for(let i=0;i<2;i++)d.push({color:'red',type:'仕',rank:12,suit:i===0?'♥':'♦'});
 for(let i=0;i<2;i++)d.push({color:'red',type:'象',rank:10,suit:i===0?'♥':'♦'});
 for(let i=0;i<2;i++)d.push({color:'red',type:'马',rank:8,suit:i===0?'♥':'♦'});
 for(let i=0;i<2;i++)d.push({color:'red',type:'车',rank:6,suit:i===0?'♥':'♦'});
 d.push({color:'red',type:'炮',rank:4,suit:'♥'});
 for(let n=2;n<=4;n++)d.push({color:'red',type:'兵',rank:2,suit:'♥',num:n});
 for(let i=0;i<2;i++)d.push({color:'black',type:'士',rank:11,suit:i===0?'♠':'♣'});
 for(let i=0;i<2;i++)d.push({color:'black',type:'相',rank:9,suit:i===0?'♠':'♣'});
 for(let i=0;i<2;i++)d.push({color:'black',type:'马',rank:7,suit:i===0?'♠':'♣'});
 for(let i=0;i<2;i++)d.push({color:'black',type:'车',rank:5,suit:i===0?'♠':'♣'});
 d.push({color:'black',type:'炮',rank:3,suit:'♠'});
 for(let n=2;n<=4;n++)d.push({color:'black',type:'卒',rank:1,suit:'♠',num:n});
 return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function analyze(c){
 if(!c||!c.length)return null;
 let l=c.length;
 if(l===1) return {type:'single', rank:c[0].rank, color:c[0].color, cards:c};
 if(l===2){
  let a=c[0], b=c[1];
  if(a.type==='炮' && b.type==='炮' && a.color!==b.color) return {type:'pair', rank:12, color:null, cards:c};
  if(a.color===b.color && a.type===b.type) return {type:'pair', rank:a.rank, color:a.color, cards:c};
  return null;
 }
 if(l===3){
  let allRed = c.every(x=>x.color==='red' && x.type==='兵');
  let allBlack = c.every(x=>x.color==='black' && x.type==='卒');
  if(allRed) return {type:'three_cows', rank:14, color:'red', cards:c};
  if(allBlack) return {type:'three_cows', rank:13, color:'black', cards:c};
 }
 return null;
}
function cmp(a,b){
 if(!a) return -1;
 if(!b) return 1;
 if(a.type !== b.type) return -1;
 if(a.rank > b.rank) return 1;
 if(a.rank < b.rank) return -1;
 return -1;
}

// ==================== 游戏主类 ====================
class Game {
 constructor(){
  this.h0=[];this.h1=[];this.h2=[];
  this.b2=[];
  this.piles=[[],[],[]];
  this.wins=[0,0,0];
  this.cur=0;
  this.roundStarter=0;
  this.roundActions=[];
  this.roundCount=0;
  this.playLog=[];
  this.firstPlay=null;
  this.over=false;
  this.stopped=false;
  this.wait=false;
  this.sel=[];
  this.timer=null;
  this.aiTimers=[];
  this.onUpd=null;this.onLog=null;this.onEnd=null;
  this.allCards=deck();
  this.playedSet=new Set();
  this.difficulty='expert';
  this.chips=[10,10,10];
  this.phase='idle';
  this.revealedCard=null;
  this.revealDrawer=-1;
  this.firstPlayer=-1;
  this.caller=-1;
  this.raiser=-1;
  this.bidResponses=[];
  this.waitingForBid=false;
  this.bidTrigger='';
  this.forcedCaller=false;
  this.midBidTriggered=false;
  this.bidFinished=false;
  this.hasCalledFold=[false,false,false];
  this.nextDrawer=-1;
  this.showingHands=false;
 }
 getHand(i){return i===0?this.h0:(i===1?this.h1:this.h2);}
 pname(i){return i===0?'你':(i===1?'左AI':'右AI');}
 log(m){if(this.onLog)this.onLog(m);}
 later(fn,ms){
  const t=setTimeout(()=>{
   this.aiTimers=this.aiTimers.filter(x=>x!==t);
   fn();
  },ms);
  this.aiTimers.push(t);
  return t;
 }
 getCardId(c){return c.color+c.type+(c.num||'')+(c.suit||'');}
 addPlayedCards(cards){for(let c of cards)this.playedSet.add(this.getCardId(c));}
 getRemainingCards(){return this.allCards.filter(c=>!this.playedSet.has(this.getCardId(c)));}
 allHaveKA(){
  const hasKA=(hand)=>hand.some(c=>['仕','士','象','相'].includes(c.type));
  return hasKA(this.h0)&&hasKA(this.h1)&&hasKA(this.h2);
 }
 drawRevealCard(){
  let d=shuffle(deck());
  let card=d[0];
  this.revealedCard=card;
  return card;
 }
 determineFirstPlayer(drawer, card){
  let type=card.type;
  let offset=0;
  if(type==='兵'||type==='卒'||type==='象'||type==='相') offset=2;
  else if(type==='仕'||type==='士'||type==='车'||type==='炮') offset=1;
  else if(type==='马') offset=0;
  else offset=1;
  return (drawer+offset)%3;
 }

 // ═══════════════════════════════════════════
 // 极简叫牌评估（修复卡死 Bug）
 // ═══════════════════════════════════════════
 evaluateAIHandStrength(hand, wins, playerIndex) {
  if (!hand || hand.length === 0) return false;

  const redSoldiers = hand.filter(c => c.color === 'red' && c.type === '兵');
  const blackSoldiers = hand.filter(c => c.color === 'black' && c.type === '卒');
  const hasRedBlackCannons =
    hand.some(c => c.color === 'red' && c.type === '炮') &&
    hand.some(c => c.color === 'black' && c.type === '炮');
  const bigCards = hand.filter(c => c.rank >= 9);

  // 无敌牌型
  if (redSoldiers.length >= 3) return true;
  if (blackSoldiers.length >= 3) return true;
  if (hasRedBlackCannons && bigCards.length >= 1) return true;

  // 对子统计
  const pairMap = {};
  for (const c of hand) {
    const k = c.color + '_' + c.type;
    pairMap[k] = (pairMap[k] || 0) + 1;
  }
  let bigPairs = 0;
  for (const k in pairMap) {
    if (pairMap[k] < 2) continue;
    const parts = k.split('_');
    const sample = hand.find(c => c.color === parts[0] && c.type === parts[1]);
    if (sample && sample.rank >= 10) bigPairs++;
  }
  if (bigPairs >= 2) return true;
  if (bigPairs >= 1 && bigCards.length >= 2) return true;

  // 其他情况不掀
  return false;
 }

 _calcChipChange(resultWins, me) {
  let winners = [], sixers = [];
  for (let i = 0; i < 3; i++) {
    if (resultWins[i] >= 3) {
      winners.push(i);
      if (resultWins[i] >= 6) sixers.push(i);
    }
  }
  let change = 0;
  for (let w of winners) {
    let point = sixers.includes(w) ? 3 : 1;
    for (let i = 0; i < 3; i++) {
      if (i !== w && !winners.includes(i)) {
        if (i === me) change -= point;
        if (w === me) change += point;
      }
    }
  }
  return change;
 }

 startBidding(trigger, forcedCaller=false){
  if(this.phase==='ended' || this.over) return;
  this.phase = 'bidding';
  this.waitingForBid=true;
  this.bidTrigger=trigger;
  this.forcedCaller=forcedCaller;
  this.bidFinished=false;
  if(trigger==='start'){
   this.caller=this.firstPlayer;
   this.raiser=-1;
   this.bidResponses=[];
   if(this.caller===0){
    this.showBidModal('start', this.caller);
   } else {

     if(this.over||!this.waitingForBid) return;
     let hand=this.getHand(this.caller);
     let wins=this.wins[this.caller];
     let shouldRaise = this.evaluateAIHandStrength(hand, wins, this.caller);
     if(!shouldRaise) this.callerCall('fold');
     else this.callerCall('raise');
    },300);
   }
  } else if(trigger==='mid'){
   this.caller=forcedCaller;
   this.raiser=-1;
   this.bidResponses=[];
   if(this.caller===0){
    this.showBidModal('mid_fold_decision', this.caller);
   } else {
    this.later(()=>{
     if(this.over||!this.waitingForBid) return;
     let hand=this.getHand(this.caller);
     let wins=this.wins[this.caller];
     let shouldRaise = this.evaluateAIHandStrength(hand, wins, this.caller);
     if(!shouldRaise) this.callerCall('fold');
     else this.callerCall('raise');
    },400);
   }
  }
 }
 callerCall(action){
  if(!this.waitingForBid || this.bidFinished) return;
  if(action==='fold'){
   this.log(this.pname(this.caller)+' 叫了“扣了”');
   this.hasCalledFold[this.caller] = true;

    this.startPlaying();

    this.phase='playing';

   }
  }
 }
 enterBidResponses(){
  if(this.bidFinished) return;
  let order=[0,1,2];
  let idx=order.indexOf(this.caller);
  let nextPlayers=order.slice(idx+1).concat(order.slice(0,idx));
  let responded=this.bidResponses.map(r=>r.player);
  let remaining=nextPlayers.filter(p=>!responded.includes(p));
  if(remaining.length===0){ this.finishBidding(); return; }
  let next=remaining[0];
  if(next===0){
   this.showBidModal('response', next);
  } else {
   this.later(()=>{
    if(this.over||!this.waitingForBid||this.bidFinished) return;
    let hand=this.getHand(next);
    let wins=this.wins[next];
    let shouldRaise = this.evaluateAIHandStrength(hand, wins, next);
    if(!shouldRaise) this.playerBidResponse(next, 'fold');
    else this.playerBidResponse(next, 'raise');
   },400);
  }
 }
 playerBidResponse(player, action){
  if(!this.waitingForBid || this.bidFinished) return;
  this.bidResponses.push({player, action});
  if(action==='raise'){
   this.raiser=player;
   this.log(this.pname(player)+' 叫“掀棋”！');
   this.bidFinished = true;
   this.waitingForBid = false;
   this.hideBidModal();
   this.phase='playing';
   this.stopped = false;
   if(this.bidTrigger==='start'){
    this.startPlaying();
   } else {
    this.resumeAfterBid();
   }

  } else {
   this.log(this.pname(player)+' 叫“不掀”');

 }
 finishBidding(){
  this.waitingForBid=false;

  let hasRaise=this.bidResponses.some(r=>r.action==='raise');
  if(!hasRaise){
    if(this.bidTrigger==='start'){

      this.nextDrawer = this.caller;

 }
 endGameMidFold(){

  let losers = [];
  for(let i=0;i<3;i++){ if(i!==winner) losers.push(i); }
  let chipChange=[0,0,0];
  chipChange[winner] += losers.length * 1;
  for(let l of losers){ chipChange[l] -= 1; }
  for(let i=0;i<3;i++){
   this.chips[i] += chipChange[i];
   if(this.chips[i]<0) this.chips[i]=0;
  }
  let msg = '结算：' + this.pname(winner) + ' +' + losers.length + '点，' + losers.map(i=>this.pname(i)+' -1点').join('、');

 restartGameWithDrawer(drawer){

 startWithDrawer(drawer){

 start(){

 dealCards(){

 }
 startPlaying(){

 resumeAfterBid(){

 }
 play(i,ci){
  if(this.over||i!==this.cur||this.stopped||this.phase!=='playing')return false;
  let hand=this.getHand(i);
  if(hand.length===0){this.log('⚠️ 手牌为空');return false;}
  let sel=ci.map(j=>hand[j]).filter(x=>x);
  if(!sel.length)return false;
  let a=analyze(sel);
  if(!a){this.log('❌ 非法牌型');this.upd();return false;}
  if(this.roundCount>0){
   if(!this.firstPlay){this.log('❌ 无基准牌型');return false;}
   if(cmp(a,this.firstPlay.analysis)<=0){
    this.log('❌ 牌不够大或类型不符');
    this.upd();return false;
   }
  }
  let sorted=ci.slice().sort((a,b)=>b-a);
  let played=[];
  for(let j of sorted)played.push(hand.splice(j,1)[0]);
  this.roundActions.push({player:i,type:'play',cards:played,analysis:a});
  this.playLog.push({player:i,cards:played,isPad:false,analysis:a});
  if(this.roundCount===0){
   this.firstPlay={cards:played,analysis:a,player:i};
  } else {
   if(cmp(a, this.firstPlay.analysis) > 0){
    this.firstPlay={cards:played,analysis:a,player:i};
   }
  }
  this.roundCount++;
  this.log('🎯 '+this.pname(i)+' 出 ['+played.map(x=>getDisplay(x)).join(' ')+']');
  this.addPlayedCards(played);
  if(this.roundCount===3){this.finishRound();return true;}
  this.advanceTurn();return true;
 }
 pad(i, force=false, idxs=null){
  if(this.over||i!==this.cur||this.stopped||this.phase!=='playing')return;
  let hand=this.getHand(i);
  if(hand.length===0){this.log('⚠️ 手牌为空');this.advanceTurn();return;}
  if(this.roundCount===0){this.log('⏭ 你是第一个出牌者，必须出牌');this.upd();return;}
  if(!force && this.canWin(hand)){
   this.log('⚠️ 有更大的牌，必须出牌');
   this.upd();return;
  }
  if(!this.firstPlay){this.log('⚠️ 无基准牌型');return;}
  let n=this.firstPlay.cards.length;
  let toPad=[];
  if(idxs && idxs.length>0){
   let sortedIdx=idxs.slice().sort((a,b)=>b-a).filter(j=>j>=0 && j<hand.length);
   for(let j of sortedIdx){ toPad.push(hand.splice(j,1)[0]); }
  }
  if(toPad.length !== n){
   let need=n-toPad.length;
   let sorted=hand.slice().sort((a,b)=>a.rank-b.rank);
   for(let k=0;k<need && k<sorted.length;k++){
    let idx=hand.indexOf(sorted[k]);
    if(idx!==-1) toPad.push(hand.splice(idx,1)[0]);
   }
  }
  if(toPad.length===0){this.log('⚠️ 无可垫之牌');return;}
  for(let c of toPad) c.isPad = true;
  let padCount = toPad.length;
  this.roundActions.push({player:i, type:'pad', cards:toPad, analysis:null});
  let dummyCards = [];
  for(let k=0;k<padCount;k++) dummyCards.push({isPad:true});
  this.playLog.push({player:i, cards:dummyCards, isPad:true, analysis:null});
  this.roundCount++;
  this.log('⏭ '+this.pname(i)+' 垫了 '+padCount+' 张');
  this.addPlayedCards(toPad);
  if(this.roundCount===3){this.finishRound();return;}
  this.advanceTurn();
 }
 advanceTurn(){
  if(this.over||this.stopped||this.phase!=='playing')return;
  if(this.roundCount===3){this.finishRound();return;}
  this.sel=[];
  let next=this.cur;let attempts=0;
  do{next=(next+1)%3;attempts++;}while(this.getHand(next).length===0&&attempts<3);
  this.cur=next;
  this.wait = (this.cur === 0);
  this.upd();
  if(this.h0.length===0&&this.h1.length===0&&this.h2.length===0){
   if(this.roundCount>0 && this.roundActions.length>0){ this.forceFinishRound(); }
   this.log('🏁 所有玩家手牌出完，游戏结束');
   this.endGame(true);
   return;
  }
  this.checkMidBid();
  if(this.cur!==0&&!this.over&&this.cur!==-1&&this.phase==='playing')this.scheduleAI();
 }
 forceFinishRound(){
  if(this.roundActions.length===0) return;
  let best=null,bestPlayer=-1;
  for(let act of this.roundActions){
   if(act.type==='play'){
    if(!best){best=act.analysis;bestPlayer=act.player;}
    else{if(cmp(act.analysis,best)>0){best=act.analysis;bestPlayer=act.player;}}
   }
  }
  if(bestPlayer===-1) bestPlayer=this.roundStarter;
  let allCards=[];
  for(let act of this.roundActions){ for(let c of act.cards) allCards.push(c); }
  let cardCount = allCards.length;
  for(let c of allCards) this.piles[bestPlayer].push(c);
  let addPiles = Math.floor(cardCount / 3);
  if(addPiles === 0 && cardCount >= 3) addPiles = 1;
  this.wins[bestPlayer] += addPiles;
  this.log('🏆 '+this.pname(bestPlayer)+' 赢得本轮 '+cardCount+' 张，摞数 +'+addPiles+'，累计'+this.wins[bestPlayer]+'摞');
  this.addPlayedCards(allCards.filter(c=>!c.isPad));
  this.roundActions=[];this.roundCount=0;this.playLog=[];
  this.firstPlay=null;
 }
 checkMidBid(){
  if(this.phase!=='playing' || this.over || this.midBidTriggered) return;
  for(let i=0;i<3;i++){
   if(this.wins[i]>=3){
    this.midBidTriggered=true;
    this.log('⚠️ '+this.pname(i)+' 已够3摞，需要决定是否“扣了”！');
    this.phase='bidding';
    this.startBidding('mid', i);
    return;
   }
  }
 }
 finishRound(){
  if(this.over||this.stopped||this.phase!=='playing')return;
  if(this.roundActions.length!==3){this.log('⚠️ 本轮人数不足');return;}
  let best=null,bestPlayer=-1;
  for(let act of this.roundActions){
   if(act.type==='play'){
    if(!best){best=act.analysis;bestPlayer=act.player;}
    else{if(cmp(act.analysis,best)>0){best=act.analysis;bestPlayer=act.player;}}
   }
  }
  if(bestPlayer===-1)bestPlayer=this.roundStarter;
  let allCards=[];
  for(let act of this.roundActions){ for(let c of act.cards) allCards.push(c); }
  let cardCount = allCards.length;
  for(let c of allCards) this.piles[bestPlayer].push(c);
  let addPiles = Math.floor(cardCount / 3);
  if(addPiles === 0 && cardCount >= 3) addPiles = 1;
  this.wins[bestPlayer] += addPiles;
  this.log('🏆 '+this.pname(bestPlayer)+' 赢得本轮 '+cardCount+' 张，摞数 +'+addPiles+'，累计'+this.wins[bestPlayer]+'摞');
  this.addPlayedCards(allCards.filter(c=>!c.isPad));
  this.roundActions=[];this.roundCount=0;this.playLog=[];
  this.firstPlay=null;
  this.cur=bestPlayer;this.roundStarter=bestPlayer;
  this.sel=[];
  this.wait = (this.cur === 0);
  this.upd();
  if(this.h0.length===0&&this.h1.length===0&&this.h2.length===0){
   this.log('🏁 所有玩家手牌出完，游戏结束');
   this.endGame(true);
  }else{
   this.checkMidBid();
   if(this.cur!==0&&!this.over&&this.cur!==-1&&this.phase==='playing')this.scheduleAI();
  }
 }
 endGame(normalEnd=true, msg=''){
  if(this.over)return;
  this.over=true;this.stopAll();this.cur=-1;this.wait=false;this.phase='ended';
  let winners=[], sixers=[];
  for(let i=0;i<3;i++){
   let w=this.wins[i];
   if(w>=3){
    winners.push(i);
    if(w>=6) sixers.push(i);
   }
  }
  if(winners.length===0){
   this.log('本轮无赢家（无人≥3摞），不计分');
   let drawer = Math.floor(Math.random()*3);
   this.nextDrawer = drawer;
   this.showNextRoundModal('无人得分', drawer);
   return;
  }
  let chipChange=[0,0,0];
  for(let w of winners){
   let point = sixers.includes(w) ? 3 : 1;
   for(let i=0;i<3;i++){
    if(i!==w && !winners.includes(i)){
     chipChange[w] += point;
     chipChange[i] -= point;
    }
   }
  }
  if(this.caller!==-1 && this.raiser!==-1){
   let callerWin = winners.includes(this.caller);
   let raiserWin = winners.includes(this.raiser);
   if(!raiserWin && callerWin){
    let extra = sixers.includes(this.caller) ? 3 : 1;
    chipChange[this.raiser] -= extra;
    chipChange[this.caller] += extra;
   }
  }
  for(let i=0;i<3;i++){
   this.chips[i] += chipChange[i];
   if(this.chips[i]<0) this.chips[i]=0;
  }
  let msg2='结算：';
  for(let i=0;i<3;i++){
   if(chipChange[i]!==0){
    let extra = sixers.includes(i) ? '（呲了）' : '';
    msg2+=this.pname(i)+extra+' '+(chipChange[i]>0?'+':'')+chipChange[i]+'点 ';
   }
  }
  if(this.caller!==-1 && this.raiser!==-1) {
   let callerWin = winners.includes(this.caller);
   let raiserWin = winners.includes(this.raiser);
   if(!raiserWin && callerWin) {
    msg2 += ' (扣了者:'+this.pname(this.caller)+', 掀棋者:'+this.pname(this.raiser)+')';
   }
  }
  this.log(msg2);
  let winnerNames = winners.map(i=>this.pname(i)).join('、');
  this.log('🏆 赢家：'+winnerNames+' ('+winners.map(i=>this.wins[i]).join('/')+'摞)');
  
  let drawer = -1;
  if(winners.length===1){
    drawer = winners[0];
  } else {
    let losers = [];
    for(let i=0;i<3;i++){ if(!winners.includes(i)) losers.push(i); }
    if(losers.length===1){ drawer = losers[0]; }
    else { drawer = Math.floor(Math.random()*3); }
  }
  this.nextDrawer = drawer;
  this.showNextRoundModal(msg2, drawer);
 }

 // ==================== AI 出牌逻辑 ====================
 canWin(hand){
  if(!this.firstPlay) return true;
  return this.findBestWin(hand, this.firstPlay.analysis, false) !== null;
 }
 findBestWin(hand,base,minimize=false){
  if(!base) return null;
  let tt=base.type, tr=base.rank;
  let candidates=[];
  if(tt==='single'){
   for(let i=0;i<hand.length;i++){
    if(hand[i].rank>tr) candidates.push({idx:[i], rank:hand[i].rank});
   }
  }else if(tt==='pair'){
   let map={};
   for(let i=0;i<hand.length;i++){
    let key=hand[i].color+'_'+hand[i].type;
    if(!map[key])map[key]=[];
    map[key].push(i);
   }
   for(let key in map){
    if(map[key].length>=2){
     let r=hand[map[key][0]].rank;
     if(r>tr) candidates.push({idx:[map[key][0],map[key][1]], rank:r});
    }
   }
   let redCannon=-1,blackCannon=-1;
   for(let i=0;i<hand.length;i++){
    if(hand[i].color==='red'&&hand[i].type==='炮')redCannon=i;
    if(hand[i].color==='black'&&hand[i].type==='炮')blackCannon=i;
   }
   if(redCannon!==-1&&blackCannon!==-1){
    let r=12;
    if(r>tr) candidates.push({idx:[redCannon,blackCannon], rank:r});
   }
   let redSoldiers=[], blackSoldiers=[];
   for(let i=0;i<hand.length;i++){
    if(hand[i].color==='red'&&hand[i].type==='兵') redSoldiers.push(i);
    if(hand[i].color==='black'&&hand[i].type==='卒') blackSoldiers.push(i);
   }
   if(redSoldiers.length>=2){
    let r=2;
    if(r>tr) candidates.push({idx:[redSoldiers[0],redSoldiers[1]], rank:r});
   }
   if(blackSoldiers.length>=2){
    let r=1;
    if(r>tr) candidates.push({idx:[blackSoldiers[0],blackSoldiers[1]], rank:r});
   }
  }else if(tt==='three_cows'){
   if(base.color==='black'){
    let redSoldiers=[];
    for(let i=0;i<hand.length;i++){
     if(hand[i].color==='red'&&hand[i].type==='兵') redSoldiers.push(i);
    }
    if(redSoldiers.length>=3) candidates.push({idx:[redSoldiers[0],redSoldiers[1],redSoldiers[2]], rank:14});
   }
  }
  if(candidates.length===0) return null;
  candidates.sort((a,b)=>a.rank - b.rank);
  if(minimize) return candidates[0].idx;
  else return candidates[candidates.length-1].idx;
 }

 // ==================== 大师级 AI ====================
 _removeCards(hand, cards) {
  for (let c of cards) {
   let idx = hand.indexOf(c);
   if (idx !== -1) hand.splice(idx, 1);
  }
 }
 _getUnknownCards(myHand) {
  let myIds = new Set(myHand.map(c => this.getCardId(c)));
  return this.allCards.filter(c =>
   !this.playedSet.has(this.getCardId(c)) && !myIds.has(this.getCardId(c))
  );
 }
 _enumPlays(hand) {
  let cands = [];
  let allCannons = this.allCards.filter(c => c.type === '炮');
  let playedCannonCount = allCannons.filter(c => this.playedSet.has(this.getCardId(c))).length;
  let myCannonCount = hand.filter(c => c.type === '炮').length;
  let unknownCannonCount = 2 - playedCannonCount - myCannonCount;
  let opponentCouldHaveDoubleCannon = unknownCannonCount >= 2;

  let isCannonSafeToPlay =
    !opponentCouldHaveDoubleCannon ||
    hand.length <= 3 ||
    myCannonCount === hand.length;

  for (let i = 0; i < hand.length; i++) {
    if (hand[i].type === '炮' && !isCannonSafeToPlay) continue;
    cands.push({
     idxs: [i], cards: [hand[i]],
     type: 'single', rank: hand[i].rank,
     analysis: analyze([hand[i]])
    });
  }
  let pairMap = {};
  for (let i = 0; i < hand.length; i++) {
   let k = hand[i].color + '_' + hand[i].type;
   if (!pairMap[k]) pairMap[k] = [];
   pairMap[k].push(i);
  }
  for (let k in pairMap) {
   if (pairMap[k].length >= 2) {
    let a = pairMap[k][0], b = pairMap[k][1];
    let cards = [hand[a], hand[b]];
    cands.push({
     idxs: [a, b], cards: cards,
     type: 'pair', rank: hand[a].rank,
     analysis: analyze(cards)
    });
   }
  }
  let rc = hand.findIndex(c => c.color === 'red' && c.type === '炮');
  let bc = hand.findIndex(c => c.color === 'black' && c.type === '炮');
  if (rc !== -1 && bc !== -1) {
   let cards = [hand[rc], hand[bc]];
   cands.push({
    idxs: [rc, bc], cards: cards,
    type: 'pair', rank: 12,
    analysis: analyze(cards)
   });
  }
  let reds = [], blacks = [];
  for (let i = 0; i < hand.length; i++) {
   if (hand[i].color === 'red' && hand[i].type === '兵') reds.push(i);
   if (hand[i].color === 'black' && hand[i].type === '卒') blacks.push(i);
  }
  if (reds.length >= 3) {
   let idxs = reds.slice(0, 3);
   let cards = idxs.map(i => hand[i]);
   cands.push({
    idxs: idxs, cards: cards,
    type: 'three_cows', rank: 14,
    analysis: analyze(cards)
   });
  }
  if (blacks.length >= 3) {
   let idxs = blacks.slice(0, 3);
   let cards = idxs.map(i => hand[i]);
   cands.push({
    idxs: idxs, cards: cards,
    type: 'three_cows', rank: 13,
    analysis: analyze(cards)
   });
  }
  return cands;
 }
 _enumWins(hand, baseAnalysis) {
  if (!baseAnalysis) return this._enumPlays(hand);
  return this._enumPlays(hand).filter(c => cmp(c.analysis, baseAnalysis) > 0);
 }
 _hasHigher(hand, baseAnalysis) {
  if (!baseAnalysis) return true;
  let tt = baseAnalysis.type, tr = baseAnalysis.rank;
  if (tt === 'single') {
   for (let c of hand) if (c.rank > tr) return true;
   return false;
  }
  if (tt === 'pair') {
   let map = {};
   for (let c of hand) {
    let k = c.color + '_' + c.type;
    map[k] = (map[k] || 0) + 1;
   }
   for (let k in map) {
    if (map[k] >= 2) {
     let parts = k.split('_');
     let color = parts[0], type = parts[1];
     let card = hand.find(c => c.color === color && c.type === type);
     if (card && card.rank > tr) return true;
    }
   }
   if (tr < 12) {
    let hasRed = hand.some(c => c.color === 'red' && c.type === '炮');
    let hasBlack = hand.some(c => c.color === 'black' && c.type === '炮');
    if (hasRed && hasBlack) return true;
   }
   return false;
  }
  if (tt === 'three_cows') {
   if (baseAnalysis.color === 'black') {
    let reds = hand.filter(c => c.color === 'red' && c.type === '兵').length;
    return reds >= 3;
   }
   return false;
  }
  return false;
 }
 _perfectOpening(hands, me, wins) {
  let cands = this._enumPlays(hands[me]);
  if (cands.length === 0) return null;
  let oppIdxs = [0, 1, 2].filter(i => i !== me && hands[i].length > 0);
  if (oppIdxs.length === 0) {
   cands.sort((a, b) => {
    if (b.cards.length !== a.cards.length) return b.cards.length - a.cards.length;
    return b.analysis.rank - a.analysis.rank;
   });
   return cands[0];
  }
  let oppMaxWins = Math.max(...oppIdxs.map(o => wins[o]));
  let myWins = wins[me];
  let mustTryWin = oppMaxWins >= 2 || myWins >= 2;

  let safe = cands.filter(c =>
   oppIdxs.every(o => !this._hasHigher(hands[o], c.analysis))
  );
  if (safe.length > 0) {
   safe.sort((a, b) => {
    if (b.cards.length !== a.cards.length) return b.cards.length - a.cards.length;
    return mustTryWin ? (b.analysis.rank - a.analysis.rank) : (a.analysis.rank - b.analysis.rank);
   });
   return safe[0];
  }
  let sorted = hands[me].slice().sort((a, b) => a.rank - b.rank);
  let fallbackIdx = -1;
  for (let i = 0; i < sorted.length; i++) {
   if (sorted[i].type !== '炮') { fallbackIdx = hands[me].indexOf(sorted[i]); break; }
  }
  if (fallbackIdx === -1) fallbackIdx = hands[me].indexOf(sorted[0]);
  let c = hands[me][fallbackIdx];
  return {
   idxs: [fallbackIdx], cards: [c],
   type: 'single', rank: c.rank,
   analysis: analyze([c])
  };
 }
 _perfectFollow(hand, base, wins, me) {
  let cands = this._enumWins(hand, base.analysis);
  if (cands.length === 0) return null;
  let oppIdxs = [0, 1, 2].filter(i => i !== me);
  let oppMaxWins = Math.max(...oppIdxs.map(o => wins[o]));
  let mustEnsureWin = oppMaxWins >= 2;
  if (mustEnsureWin) {
   cands.sort((a, b) => b.analysis.rank - a.analysis.rank);
  } else {
   cands.sort((a, b) => a.analysis.rank - b.analysis.rank);
  }
  return cands[0];
 }
 _simulateGame(hands, wins, initBase, initBasePlayer, initActed, initPending, initNext) {
  let h = [hands[0].slice(), hands[1].slice(), hands[2].slice()];
  let w = wins.slice();
  let base = initBase;
  let basePlayer = initBasePlayer;
  let acted = initActed.slice();
  let pending = initPending.slice();
  let cur = initNext;
  let safety = 0;

  while (safety++ < 200) {
   if (h[0].length === 0 && h[1].length === 0 && h[2].length === 0) break;
   if (w[0] >= 3 || w[1] >= 3 || w[2] >= 3) break;

   let tries = 0;
   while (h[cur].length === 0 && tries < 3) { cur = (cur + 1) % 3; tries++; }
   if (tries >= 3) break;

   if (acted.length >= 3) {
    let total = 0;
    for (let a of pending) total += a.cards.length;
    let add = Math.floor(total / 3);
    if (add === 0 && total >= 3) add = 1;
    if (basePlayer >= 0) w[basePlayer] += add;
    cur = basePlayer >= 0 ? basePlayer : cur;
    base = null;
    basePlayer = -1;
    acted = [];
    pending = [];
    continue;
   }

   let hand = h[cur];
   if (base === null) {
    let cand = this._perfectOpening(h, cur, w);
    if (!cand) break;
    this._removeCards(hand, cand.cards);
    base = cand.analysis;
    basePlayer = cur;
    pending = [{ player: cur, cards: cand.cards }];
    acted = [cur];
   } else {
    let win = this._perfectFollow(hand, base, w, cur);
    if (win) {
     this._removeCards(hand, win.cards);
     base = win.analysis;
     basePlayer = cur;
     pending.push({ player: cur, cards: win.cards });
    } else {
     let n = base.cards.length;
     let sorted = hand.slice().sort((a, b) => a.rank - b.rank);
     let pads = sorted.slice(0, Math.min(n, hand.length));
     this._removeCards(hand, pads);
     pending.push({ player: cur, cards: pads });
    }
    acted.push(cur);
   }
   cur = (cur + 1) % 3;
  }
  return w;
 }

 _mcEvaluate(candidate, me, N) {
  let myHand = this.getHand(me);
  let myNewHand = myHand.filter(c => !candidate.cards.includes(c));

  let acted = this.roundActions.map(a => a.player);
  let pending = this.roundActions.map(a => ({ player: a.player, cards: a.cards }));

  let newBase, newBasePlayer, newActed, newPending, newNext;
  if (this.roundCount === 0) {
   newBase = candidate.analysis;
   newBasePlayer = me;
   newActed = [me];
   newPending = [{ player: me, cards: candidate.cards }];
  } else {
   newBase = candidate.analysis;
   newBasePlayer = me;
   newActed = acted.concat([me]);
   newPending = pending.concat([{ player: me, cards: candidate.cards }]);
  }
  newNext = (me + 1) % 3;

  let winsBase = [this.wins[0], this.wins[1], this.wins[2]];
  let unknown = this._getUnknownCards(myHand);
  let oppIdxs = [0, 1, 2].filter(i => i !== me);
  let opp1Len = this.getHand(oppIdxs[0]).length;
  let opp2Len = this.getHand(oppIdxs[1]).length;

  if (unknown.length < opp1Len + opp2Len) {
   return this.evaluatePlay(myHand, candidate, winsBase[me],
    oppIdxs.map(i => winsBase[i]), unknown, null);
  }

  let chipSum = 0;
  for (let it = 0; it < N; it++) {
   let unk = shuffle(unknown.slice());
   let h1 = unk.slice(0, opp1Len);
   let h2 = unk.slice(opp1Len, opp1Len + opp2Len);

   let hands = [];
   hands[me] = myNewHand.slice();
   hands[oppIdxs[0]] = h1;
   hands[oppIdxs[1]] = h2;

   let resultWins = this._simulateGame(
    hands, winsBase, newBase, newBasePlayer, newActed, newPending, newNext
   );

   chipSum += this._calcChipChange(resultWins, me);
  }
  return chipSum / N;
 }

 _masterOpening(hand, me) {
  let cands = this._enumPlays(hand);
  if (cands.length === 0) {
   let sorted = hand.slice().sort((a, b) => a.rank - b.rank);
   return [hand.indexOf(sorted[0])];
  }
  let oppWins = [0,1,2].filter(i=>i!==me).map(i=>this.wins[i]);
  let remaining = this.getRemainingCards();
  let pre = cands.map(c => ({
   cand: c,
   score: this.evaluatePlay(hand, c, this.wins[me], oppWins, remaining, null)
  }));
  pre.sort((a, b) => b.score - a.score);
  let top = pre.slice(0, 8);

  let best = null, bestScore = -Infinity;
  for (let p of top) {
   let score = this._mcEvaluate(p.cand, me, 30);
   if (score > bestScore) {
    bestScore = score;
    best = p.cand;
   }
  }
  return best ? best.idxs : [hand.indexOf(hand[0])];
 }

 _masterFollow(hand, base, me) {
  let cands = this._enumWins(hand, base.analysis);
  if (cands.length === 0) return null;
  if (cands.length === 1) return cands[0].idxs;
  if (cands.length > 8) {
   let remaining = this.getRemainingCards();
   let oppWins = [0,1,2].filter(i=>i!==me).map(i=>this.wins[i]);
   cands = cands.map(c => ({
     cand: c,
     score: this.evaluatePlay(hand, c, this.wins[me], oppWins, remaining, base)
   })).sort((a, b) => b.score - a.score).slice(0, 8).map(x => x.cand);
  }
  let best = null, bestScore = -Infinity;
  for (let c of cands) {
   let score = this._mcEvaluate(c, me, 30);
   if (score > bestScore) {
    bestScore = score;
    best = c;
   }
  }
  return best ? best.idxs : null;
 }

 evaluatePlay(hand, candidate, myWins, opponentWins, remaining, baseType=null) {
   let candidateIdxs = candidate.idxs || [];
   let remainingHand = hand.filter((_,idx)=>!candidateIdxs.includes(idx));
   let winProb = 1.0;
   let risk = 0;
   let cardCount = candidate.cards.length;
   if(candidate.type==='three_cows'){
     if(candidate.rank===13){
       let redThree = remaining.filter(c=>c.color==='red'&&c.type==='兵').length;
       if(redThree>=3) { winProb = 0.6; risk = 1; }
     }
   } else if(candidate.type==='pair'){
     let larger = 0;
     let pairCount = {};
     for(let c of remaining){
       let key = c.color+'_'+c.type;
       pairCount[key] = (pairCount[key]||0)+1;
     }
     for(let key in pairCount){
       if(pairCount[key]>=2){
         let rank = 0;
         if(key.includes('炮')){
           let red = remaining.some(c=>c.color==='red'&&c.type==='炮');
           let black = remaining.some(c=>c.color==='black'&&c.type==='炮');
           if(red&&black) rank=12;
         } else {
           let color = key.split('_')[0];
           let type = key.split('_')[1];
           let card = remaining.find(c=>c.color===color&&c.type===type);
           if(card) rank = card.rank;
         }
         if(rank > candidate.rank) larger++;
       }
     }
     if(larger>0) { winProb = Math.max(0, 1 - larger*0.3); risk = larger; }
   } else {
     let larger = remaining.filter(c=>c.rank > candidate.rank).length;
     if(larger>0) { winProb = Math.max(0, 1 - larger*0.15); risk = larger; }
   }
   let cardCountBonus = cardCount * 2.5;
   let futureValue = this.evaluateHand(remainingHand, myWins);
   let pairCount = this.countPairs(hand);
   let pairBonus = 0;
   if(pairCount >= 1 && candidate.type==='pair') pairBonus = 6;
   if(pairCount >= 2 && candidate.type==='pair') pairBonus = 10;
   let hasThree = hand.some(c=>c.type==='兵'&&c.color==='red'&& hand.filter(x=>x.type==='兵'&&x.color==='red').length>=3) ||
                  hand.some(c=>c.type==='卒'&&c.color==='black'&& hand.filter(x=>x.type==='卒'&&x.color==='black').length>=3);
   let threePenalty = 0;
   if(hasThree && candidate.type==='single' && remainingHand.length > 3) threePenalty = 12;
   let bigSinglePenalty = 0;
   if(candidate.type==='single' && candidate.rank===12) bigSinglePenalty = 25;
   if(candidate.type==='single' && candidate.rank===11) bigSinglePenalty = 8;
   let maxOpp = opponentWins.length ? Math.max(...opponentWins) : 0;
   let threatBonus = 0;
   if(maxOpp >= 2) threatBonus = 12 * winProb;
   let selfUrgency = 0;
   if(myWins >= 2) selfUrgency = 10 * winProb;
   if(myWins >= 3) selfUrgency = 20 * winProb;
   let baseCardCount = (baseType && baseType.cards) ? baseType.cards.length : 1;
   let totalCardsThisRound = baseCardCount * 3;
   let addPiles = Math.floor(totalCardsThisRound / 3);
   let myNewWins = myWins + addPiles;
   let reachGoalBonus = 0;
   if(myNewWins >= 3) reachGoalBonus = 20;
   let blockOppBonus = 0;
   if(maxOpp >= 2 && this.canWin(hand)) { blockOppBonus = 8; }
   let futureBigCards = remainingHand.filter(c=>c.rank>=10).length;
   let futureBigPenalty = (futureBigCards === 0 && remainingHand.length>0) ? 5 : 0;
   let openingBonus = (this.roundCount === 0) ? 2.5 : 0;
   let score = winProb * 3.5 + futureValue * 0.6 + cardCountBonus + pairBonus + threatBonus + selfUrgency
               + reachGoalBonus + blockOppBonus + openingBonus
               - threePenalty - bigSinglePenalty - risk * 0.5 - futureBigPenalty;
   if(remainingHand.length === 0) score += 100;
   return score;
 }
 countPairs(hand){
   let map={};
   for(let c of hand){
     let key=c.color+'_'+c.type;
     map[key]=(map[key]||0)+1;
   }
   let cnt=0;
   for(let k in map) if(map[k]>=2) cnt++;
   let redCannon=hand.some(c=>c.color==='red'&&c.type==='炮');
   let blackCannon=hand.some(c=>c.color==='black'&&c.type==='炮');
   if(redCannon&&blackCannon) cnt++;
   return cnt;
 }
 evaluateHand(hand, myWins){
  if(!hand||hand.length===0)return 0;
  let score=0;
  let redSoldiers=hand.filter(c=>c.color==='red'&&c.type==='兵');
  let blackSoldiers=hand.filter(c=>c.color==='black'&&c.type==='卒');
  if(redSoldiers.length>=3)score+=30;
  if(blackSoldiers.length>=3)score+=25;
  let pairMap={};
  for(let c of hand){
   if(c.type==='炮'){
    if(c.color==='red')pairMap['cannon_red']=(pairMap['cannon_red']||0)+1;
    else pairMap['cannon_black']=(pairMap['cannon_black']||0)+1;
   }else{
    let key=c.color+'_'+c.type;
    pairMap[key]=(pairMap[key]||0)+1;
   }
  }
  for(let key in pairMap){
   if(pairMap[key]>=2){
    if(key==='cannon_red'||key==='cannon_black'){
     if(pairMap['cannon_red']>=1&&pairMap['cannon_black']>=1)score+=20;
    }else{
     let color=key.split('_')[0];
     let type=key.split('_')[1];
     let card=hand.find(c=>c.color===color&&c.type===type);
     if(card)score+=card.rank*2;
    }
   }
  }
  for(let c of hand){
   if(c.rank>=10)score+=c.rank*0.8;
   else score+=c.rank*0.3;
  }
  if(myWins>=2) score *= 0.8;
  return score;
 }
 chooseOpeningEasy(hand){
  let maxRank=-Infinity, idx=-1;
  for(let i=0;i<hand.length;i++){
   if(hand[i].rank>maxRank){maxRank=hand[i].rank; idx=i;}
  }
  return idx!==-1?[idx]:null;
 }
 chooseOpening(hand, myWins, remaining){
  if(this.difficulty==='easy') return this.chooseOpeningEasy(hand);
  if(this.difficulty==='expert') return this._masterOpening(hand, this.cur);
  let candidates=[];
  let redIdxs=[], blackIdxs=[];
  for(let i=0;i<hand.length;i++){
   if(hand[i].color==='red'&&hand[i].type==='兵') redIdxs.push(i);
   if(hand[i].color==='black'&&hand[i].type==='卒') blackIdxs.push(i);
  }
  if(redIdxs.length>=3) candidates.push({idxs:redIdxs.slice(0,3), type:'three_cows', rank:14, cards:redIdxs.slice(0,3).map(i=>hand[i])});
  if(blackIdxs.length>=3) candidates.push({idxs:blackIdxs.slice(0,3), type:'three_cows', rank:13, cards:blackIdxs.slice(0,3).map(i=>hand[i])});
  let pairMap={};
  for(let i=0;i<hand.length;i++){
   let key=hand[i].color+'_'+hand[i].type;
   if(!pairMap[key]) pairMap[key]=[];
   pairMap[key].push(i);
  }
  for(let key in pairMap){
   if(pairMap[key].length>=2){
    let idxs=pairMap[key].slice(0,2);
    let rank=hand[idxs[0]].rank;
    candidates.push({idxs:idxs, type:'pair', rank:rank, cards:idxs.map(i=>hand[i])});
   }
  }
  let redCannon=hand.findIndex(c=>c.color==='red'&&c.type==='炮');
  let blackCannon=hand.findIndex(c=>c.color==='black'&&c.type==='炮');
  if(redCannon!==-1&&blackCannon!==-1){
   candidates.push({idxs:[redCannon,blackCannon], type:'pair', rank:12, cards:[hand[redCannon], hand[blackCannon]]});
  }
  for(let i=0;i<hand.length;i++){
   candidates.push({idxs:[i], type:'single', rank:hand[i].rank, cards:[hand[i]]});
  }
  if(candidates.length===0){
   let minRank=Infinity, idx=-1;
   for(let i=0;i<hand.length;i++){
    if(hand[i].rank<minRank){minRank=hand[i].rank; idx=i;}
   }
   if(idx!==-1) return [idx];
   return null;
  }
  let opponentWins = this.wins.filter((_,idx)=>idx!==this.cur);
  let bestScore = -Infinity;
  let bestCand = null;
  for(let cand of candidates){
    let score = this.evaluatePlay(hand, cand, myWins, opponentWins, remaining, null);
    if(score > bestScore){
      bestScore = score;
      bestCand = cand;
    }
  }
  if(bestCand && bestCand.type==='single' && bestCand.rank===12){
    let backup = candidates.filter(c=>!(c.type==='single'&&c.rank===12));
    if(backup.length>0){
      let bestBack = null, bestBackScore = -Infinity;
      for(let c of backup){
        let sc = this.evaluatePlay(hand, c, myWins, opponentWins, remaining, null);
        if(sc > bestBackScore){ bestBackScore = sc; bestBack = c; }
      }
      if(bestBack) bestCand = bestBack;
    }
  }
  return bestCand ? bestCand.idxs : null;
 }
 decideFollow(hand, base, myWins, opponentWins, remaining){
   if(this.difficulty==='easy'){
     return this.findBestWin(hand, base.analysis, false) || null;
   }
   if(this.difficulty==='expert'){
     return this._masterFollow(hand, base, this.cur);
   }
   let allCandidates = [];
   let tt = base.analysis.type;
   let tr = base.analysis.rank;
   if(tt==='single'){
     for(let i=0;i<hand.length;i++){
       if(hand[i].rank > tr){
         allCandidates.push({idxs:[i], type:'single', rank:hand[i].rank, cards:[hand[i]]});
       }
     }
   } else if(tt==='pair'){
     let map={};
     for(let i=0;i<hand.length;i++){
       let key=hand[i].color+'_'+hand[i].type;
       if(!map[key])map[key]=[];
       map[key].push(i);
     }
     for(let key in map){
       if(map[key].length>=2){
         let r=hand[map[key][0]].rank;
         if(r>tr) allCandidates.push({idxs:[map[key][0],map[key][1]], type:'pair', rank:r, cards:[hand[map[key][0]], hand[map[key][1]]]});
       }
     }
     let redC=hand.findIndex(c=>c.color==='red'&&c.type==='炮');
     let blackC=hand.findIndex(c=>c.color==='black'&&c.type==='炮');
     if(redC!==-1&&blackC!==-1){
       let r=12;
       if(r>tr) allCandidates.push({idxs:[redC,blackC], type:'pair', rank:r, cards:[hand[redC], hand[blackC]]});
     }
     let redSoldiers=[], blackSoldiers=[];
     for(let i=0;i<hand.length;i++){
       if(hand[i].color==='red'&&hand[i].type==='兵') redSoldiers.push(i);
       if(hand[i].color==='black'&&hand[i].type==='卒') blackSoldiers.push(i);
     }
     if(redSoldiers.length>=2){
       let r=2;
       if(r>tr) allCandidates.push({idxs:[redSoldiers[0],redSoldiers[1]], type:'pair', rank:r, cards:[hand[redSoldiers[0]], hand[redSoldiers[1]]]});
     }
     if(blackSoldiers.length>=2){
       let r=1;
       if(r>tr) allCandidates.push({idxs:[blackSoldiers[0],blackSoldiers[1]], type:'pair', rank:r, cards:[hand[blackSoldiers[0]], hand[blackSoldiers[1]]]});
     }
   } else if(tt==='three_cows'){
     if(base.analysis.color==='black'){
       let redSoldiers=[];
       for(let i=0;i<hand.length;i++){
         if(hand[i].color==='red'&&hand[i].type==='兵') redSoldiers.push(i);
       }
       if(redSoldiers.length>=3){
         allCandidates.push({idxs:[redSoldiers[0],redSoldiers[1],redSoldiers[2]], type:'three_cows', rank:14, cards:[hand[redSoldiers[0]], hand[redSoldiers[1]], hand[redSoldiers[2]]]});
       }
     }
   }
   if(allCandidates.length===0) return null;
   let bestScore = -Infinity;
   let bestCand = null;
   for(let cand of allCandidates){
     let score = this.evaluatePlay(hand, cand, myWins, opponentWins, remaining, base);
     if(score > bestScore){
       bestScore = score;
       bestCand = cand;
     }
   }
   return bestCand ? bestCand.idxs : null;
 }
 stopAll(){

  for(let t of this.aiTimers){clearTimeout(t);}

 scheduleAI(){
  if(this.over||this.stopped||this.cur===0||this.cur===-1||this.phase!=='playing')return;
  this.later(()=>{
   if(this.over||this.stopped||this.cur===0||this.cur===-1||this.phase!=='playing')return;
   this.aiTurn(this.cur);
  },400+Math.random()*300);
 }
 aiTurn(i){
  if(this.over||i!==this.cur||this.stopped||i===-1||this.phase!=='playing')return;
  let hand=this.getHand(i);
  if(hand.length===0){this.log('⏭ '+this.pname(i)+' 手牌为空');this.advanceTurn();return;}
  if(this.roundCount===0){
   let remaining=this.getRemainingCards();
   let opening=this.chooseOpening(hand, this.wins[i], remaining);
   if(!opening || opening.length===0){
    let minIdx = 0;
    for(let j=1;j<hand.length;j++) if(hand[j].rank < hand[minIdx].rank) minIdx = j;
    opening = [minIdx];
   }
   let success = this.play(i, opening);
   if(!success) this.pad(i, true);
   return;
  }
  let base=this.firstPlay;
  if(!base){this.advanceTurn();return;}
  let opponentWins = this.wins.filter((_,idx)=>idx!==i);
  let remaining=this.getRemainingCards();
  let can = this.canWin(hand);
  if(!can){ this.pad(i,true); return; }
  let best = this.decideFollow(hand, base, this.wins[i], opponentWins, remaining);
  if(!best) best = this.findBestWin(hand, base.analysis, false);
  if(best){
   let success=this.play(i, best);
   if(!success) this.pad(i,true);
  } else {
   this.pad(i,true);
  }
 }
 toggle(i){
  if(this.over||this.cur!==0||this.phase!=='playing')return;
  let p=this.sel.indexOf(i);

 }
 humanPlay(){
  if(this.over){ this.log('⚠️ 游戏已结束'); return; }
  if(this.cur!==0){ this.log('⚠️ 当前不是你的回合'); return; }
  if(this.phase!=='playing'){ this.log('⚠️ 当前阶段不是playing'); return; }
  let hand=this.h0;
  if(hand.length===0){this.log('⚠️ 无手牌'); this.advanceTurn(); return;}
  if(!this.sel.length){this.log('⚠️ 请选牌'); return;}
  let selected = this.sel.map(i=>hand[i]).filter(Boolean);
  if(selected.length !== this.sel.length){
   this.log('⚠️ 选牌已失效，请重新选择');
   this.sel=[]; this.upd(); return;
  }
  let analysis = analyze(selected);
  if(!analysis){
   this.log('❌ 非法牌型，请重新选牌（单张/对子/三兵/三卒）');
   return;
  }
  let idx=this.sel.slice().sort((a,b)=>a-b);
  this.sel=[];
  let success = this.play(0, idx);
  if(!success) this.log('❌ 出牌失败，请重试');
  this.upd();
 }
 humanPad(){
  if(this.over||this.cur!==0||this.phase!=='playing')return;
  let hand=this.h0;
  if(hand.length===0){this.log('⚠️ 无手牌');this.advanceTurn();return;}
  if(this.roundCount===0){this.log('⏭ 你是第一个出牌者，不能垫牌');return;}
  if(this.canWin(hand)){this.log('⚠️ 有更大的牌，必须出牌');return;}
  let n=this.firstPlay?this.firstPlay.cards.length:1;
  if(hand.length<n){this.log('⚠️ 手牌不足');this.advanceTurn();return;}
  if(this.sel.length!==n){this.log('⚠️ 请选恰好 '+n+' 张');return;}
  let idx=this.sel.slice().sort((a,b)=>a-b);
  this.sel=[];
  this.pad(0, true, idx);
 }
